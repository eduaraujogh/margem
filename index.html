<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Margem Estudos</title>
<meta name="description" content="Estudos de Planejamento Estratégico a partir dos materiais da disciplina.">
<meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Margem">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  try { const t = localStorage.getItem("margem.tema"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
  <a class="skip" href="#main">Ir para o conteúdo</a>
  <header class="topbar" id="topbar">
    <button class="icon-btn back" id="voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Margem, início">Margem</a>
    <div class="topbar-title" id="titulo-topo" aria-hidden="true"></div>
    <a class="icon-btn" href="#/busca" aria-label="Buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    </a>
  </header>

  <main id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Navegação principal">
    <a href="#/" data-tab="hoje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span>Hoje</span>
    </a>
    <a href="#/trilha" data-tab="trilha">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h9"/></svg><span>Trilha</span>
    </a>
    <a href="#/revisar" data-tab="revisar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M17.5 3.5v3.5H14M6.5 20.5V17H10"/></svg><span>Revisar</span>
    </a>
    <a href="#/biblioteca" data-tab="biblioteca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.5h5v14h-5zM9.5 5.5h5v14h-5zM15 6.4l4.2-1.2 3.1 13.6-4.2 1.1z" transform="translate(-1.2 0)"/></svg><span>Biblioteca</span>
    </a>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-titulo" hidden>
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-titulo"></h2>
      <button class="icon-btn" id="sheet-fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">O Margem precisa de JavaScript ativado.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
